<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Curriculum / Semester Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0904; --panel:#161208; --panel2:#1d170b; --ink:#ffb84a; --dim:#7a5f30; --paper:#f3e6c4;
  --body:#bda874; --green:#52ff8a; --red:#ff5252;
  --line:rgba(255,184,74,.18); --line2:rgba(255,184,74,.32);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:1.5;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--bg)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}

/* CRT overlays */
.scan{position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(180deg,rgba(255,184,74,0) 0,rgba(255,184,74,0) 2px,rgba(255,184,74,.04) 2px,rgba(255,184,74,.04) 3px);mix-blend-mode:overlay}
.grain{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:9997;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.45))}
@keyframes blink{50%{opacity:.3}}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:rgba(10,9,4,.96);border-bottom:1px solid var(--line2);position:relative;z-index:10;font-size:12px;letter-spacing:.04em}
.brand{font-weight:700;font-size:15px;letter-spacing:.06em;display:flex;align-items:center;gap:9px;margin-right:10px;white-space:nowrap;color:var(--ink);text-transform:uppercase}
.brand::before{content:"";width:9px;height:9px;background:var(--green);box-shadow:0 0 12px var(--green);animation:blink 1.4s infinite}
.brand span{color:var(--dim);font-weight:400}
.spacer{flex:1}
.clock{color:var(--dim);font-size:11px;white-space:nowrap;margin-left:6px}
.clock b{color:var(--ink);font-weight:500}

/* ---------- Layout ---------- */
.main-content{flex:1;overflow-y:auto;padding:30px;display:flex;justify-content:center;}
.container{width:100%;max-width:1100px;}

/* View Header & Breadcrumbs */
.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid var(--line2);padding-bottom:12px;}
.view-title{font-size:16px;color:var(--ink);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:0;display:flex;align-items:center;gap:10px;}
.view-title::before{content:"»";color:var(--dim);}
.back-btn{display:inline-flex;align-items:center;text-decoration:none;font-family:inherit;font-size:12px;letter-spacing:.05em;color:var(--body);background:none;border:1px solid transparent;padding:6px 12px;cursor:pointer;transition:all .15s;}
.back-btn::before{content:"< ";color:var(--dim);}
.back-btn:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,184,74,.05);}

/* Grids */
.grid-8{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.grid-links{display:flex;flex-direction:column;gap:10px;max-width:500px;}

@media (max-width:900px){
  .grid-8{grid-template-columns:repeat(2,1fr);}
}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:6px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.4);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;}
.card:hover{border-color:var(--ink);box-shadow:0 0 20px rgba(255,184,74,.15);transform:translateY(-2px);}
.card-head{display:flex;gap:6px;align-items:center;padding:12px 16px;background:rgba(255,184,74,.06);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink);letter-spacing:.05em;font-weight:600;text-transform:uppercase;}
.card-head .dots{display:flex;gap:5px;margin-right:10px}
.card-head .dots i{width:8px;height:8px;border-radius:50%}
.card-head .dots i:nth-child(1){background:var(--red)}
.card-head .dots i:nth-child(2){background:var(--ink)}
.card-head .dots i:nth-child(3){background:var(--green)}
.card-body{padding:20px 16px;font-size:13px;color:var(--body);display:flex;align-items:center;justify-content:center;flex:1;}

/* Links / Buttons */
a.link-btn{
  display:inline-flex;align-items:center;text-decoration:none;
  font-family:inherit;font-size:13px;letter-spacing:.05em;color:var(--body);
  background:none;border:1px solid transparent;padding:10px 14px;border-radius:0;
  cursor:pointer;transition:color .15s,background .15s,border-color .15s,box-shadow .2s;
  width:100%;
}
a.link-btn::before{content:"[ ";color:var(--dim);transition:color .15s;}
a.link-btn::after{content:" ]";color:var(--dim);transition:color .15s;margin-left:auto;}
a.link-btn:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,184,74,.05);}
a.link-btn:hover::before,a.link-btn:hover::after{color:var(--ink);}

a.link-btn.special{
  color:var(--bg);background:var(--ink);
  box-shadow:0 0 18px rgba(255,184,74,.35);
  border-color:var(--ink); font-weight:600;
}
a.link-btn.special::before,a.link-btn.special::after{color:var(--bg);}
a.link-btn.special:hover{background:#ffd27a;box-shadow:0 0 24px rgba(255,184,74,.5);color:var(--bg);}

/* Empty State */
.empty-state {
  color: var(--dim);
  padding: 40px;
  text-align: center;
  font-style: italic;
  border: 1px dashed var(--line2);
  border-radius: 6px;
  background: rgba(0,0,0,0.2);
}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a2e18}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<div class="scan"></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">CS Curriculum <span>/ semester hub</span></div>
    <div class="spacer"></div>
    <div class="clock">SYS · <b id="clock">--:--:--</b></div>
  </header>

  <div class="main-content">
    <div class="container" id="appContainer">
      <!-- Content will be dynamically injected here by JS -->
    </div>
  </div>
</div>

<script>
// DATA STRUCTURE
const curriculum = {
  "Semester 01": [],
  "Semester 02": [
    { name: "Derivatives_Visualizer", url: "Derivatives_Visualizer.html", isSpecial: true },
    { name: "Dijkstra_Algorithm", url: "Dijkstra_Algorithm.html", isSpecial: true },
    { name: "InverseMatrix_RootFinder", url: "InverseMatrix_RootFinder.html", isSpecial: true },
    { name: "Kruskal_Algorithm", url: "Kruskal_Algorithm.html", isSpecial: true },
    { name: "N-ary_to_Binary", url: "N-ary_to_Binary.html", isSpecial: true },
    { name: "Tree_Traversal", url: "Tree_Traversal.html", isSpecial: true }
  ],
  "Semester 03": [],
  "Semester 04": [],
  "Semester 05": [],
  "Semester 06": [],
  "Semester 07": [],
  "Semester 08": []
};

let currentView = 'semesters';
let activeSemester = null;
const container = document.getElementById('appContainer');

function render() {
  if (currentView === 'semesters') renderSemesters();
  else if (currentView === 'links') renderLinks();
}

function renderSemesters() {
  let html = `
    <div class="view-header">
      <h1 class="view-title">All Semesters</h1>
    </div>
    <div class="grid-8">
  `;
  Object.keys(curriculum).forEach(sem => {
    html += `
      <div class="card" onclick="selectSemester('${sem}')">
        <div class="card-head"><div class="dots"><i></i><i></i><i></i></div> ${sem}</div>
        <div class="card-body">Click to view programs</div>
      </div>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function renderLinks() {
  let html = `
    <div class="view-header">
      <h1 class="view-title">${activeSemester} / Programs</h1>
      <button class="back-btn" onclick="goBack()">Back to Semesters</button>
    </div>
  `;

  const links = curriculum[activeSemester];
  
  if (links.length === 0) {
    html += `<div class="empty-state">[ No programs available for this semester yet ]</div>`;
  } else {
    html += `<div class="grid-links">`;
    links.forEach(link => {
      html += `
        <a href="${link.url}" class="link-btn ${link.isSpecial ? 'special' : ''}">
          ${link.name}
        </a>
      `;
    });
    html += `</div>`;
  }
  
  container.innerHTML = html;
}

function selectSemester(sem) {
  activeSemester = sem;
  currentView = 'links';
  window.location.hash = `semester-${sem.split(' ')[1]}`;
  render();
}

function goBack() {
  activeSemester = null;
  currentView = 'semesters';
  window.location.hash = '';
  render();
}

// Handle deep linking from other pages
function handleHashRouting() {
  const hash = window.location.hash;
  
  if (hash.startsWith('#semester-')) {
    const semNum = hash.replace('#semester-', '').split('/')[0]; 
    const semKey = Object.keys(curriculum).find(k => k.includes(semNum));
    if (semKey) {
      activeSemester = semKey;
      currentView = 'links';
      render();
      return;
    }
  }
  
  // Default
  render();
}

handleHashRouting();

function tickClock(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  const el = document.getElementById('clock'); 
  if (el) el.textContent = z(d.getUTCHours())+':'+z(d.getUTCMinutes())+':'+z(d.getUTCSeconds())+'Z';
}
tickClock(); setInterval(tickClock, 1000);
</script>
</body>
</html>
